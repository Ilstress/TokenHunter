spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tokenhunter?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

tokenhunter:
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
    lmstudio:
      base-url: ${LMSTUDIO_BASE_URL:http://localhost:1234}
      api-key: not-needed
